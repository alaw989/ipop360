# Supervisor program for `php artisan queue:work` (AI enrichment, async jobs).
#
# Processes queued jobs (EnrichRestaurantWithAi, etc.) from the database queue.
# Two worker processes run in parallel; each restarts hourly to shed memory.
# Restart: autorestart=true respawns within 5s if the process crashes.
# Idempotent: installed by deploy.yml "Register queue worker supervisor program".
[program:ipop360-worker]
process_name=%(program_name)s_%(process_num)02d
command=php {{DEPLOY_PATH}}/artisan queue:work --sleep=3 --tries=5 --max-time=3600
directory={{DEPLOY_PATH}}
autostart=true
autorestart=true
startsecs=3
startretries=8
stopwaitsecs=10
user=www-data
numprocs=2
stdout_logfile={{DEPLOY_PATH}}/storage/logs/queue-worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=2
stderr_logfile={{DEPLOY_PATH}}/storage/logs/queue-worker.log
