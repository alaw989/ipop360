# Supervisor program for `php artisan schedule:work` (secondary safeguard).
#
# Primary: cron runs `schedule:run` every minute.
# Secondary: supervisor keeps `schedule:work` running as a long-lived process.
# If cron stalls, schedule:work still dispatches due tasks.
# Restart: autorestart=true respawns within 5s if the process crashes.
# Idempotent: installed by deploy.yml "Register scheduler supervisor program".
[program:ipop360-scheduler]
process_name=%(program_name)s_%(process_num)02d
command=php {{DEPLOY_PATH}}/artisan schedule:work
directory={{DEPLOY_PATH}}
autostart=true
autorestart=true
startsecs=3
startretries=8
stopwaitsecs=10
user=www-data
stdout_logfile={{DEPLOY_PATH}}/storage/logs/scheduler.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=2
stderr_logfile={{DEPLOY_PATH}}/storage/logs/scheduler.log
