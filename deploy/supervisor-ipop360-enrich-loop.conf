# Supervisor program for the free-source enrich loop.
#
# Runs scripts/enrich-loop.sh as a long-lived daemon. Continuously cycles
# through all configured cities x cuisines using only free APIs (BizData,
# Overpass, Socrata). After each full pass, pauses for ENRICH_INTERVAL
# (default 3600s) before the next cycle.
#
# Each cycle: enrich --all-cities --free-only (with 30m timeout) →
#             restaurants:score → sleep ENRICH_INTERVAL → repeat
#
# Autorestart respawns within 5s if the process crashes unexpectedly.
# To stop: supervisorctl stop ipop360-enrich-loop
[program:ipop360-enrich-loop]
process_name=%(program_name)s_%(process_num)02d
command=/bin/bash {{DEPLOY_PATH}}/scripts/enrich-loop.sh
directory={{DEPLOY_PATH}}
autostart=true
autorestart=true
startsecs=10
startretries=3
stopwaitsecs=30
user=www-data
stdout_logfile={{DEPLOY_PATH}}/storage/logs/enrich-loop.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=2
stderr_logfile={{DEPLOY_PATH}}/storage/logs/enrich-loop.log
