name: Debug - Tail Production Logs

on:
  workflow_dispatch:
    inputs:
      lines:
        description: 'Number of log lines to tail'
        required: false
        default: '200'

jobs:
  tail-logs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.DROPLET_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Tail laravel + scheduler logs (read-only)
        run: |
          ssh -i ~/.ssh/deploy_key \
            ${{ secrets.DROPLET_USER }}@${{ secrets.DROPLET_HOST }} \
            "cd ${{ secrets.DEPLOY_PATH }} && \
             echo '--- disk usage ---' && df -h . && \
             echo '--- storage/logs ---' && ls -la storage/logs && \
             echo '--- latest laravel log (tail -n ${{ github.event.inputs.lines }}) ---' && \
             (tail -n ${{ github.event.inputs.lines }} storage/logs/laravel.log 2>/dev/null || \
              tail -n ${{ github.event.inputs.lines }} storage/logs/laravel-\$(date +%Y-%m-%d).log 2>/dev/null || \
              echo 'no laravel log found at expected path') && \
             echo '--- scheduler.log tail ---' && \
             tail -n 50 storage/logs/scheduler.log 2>/dev/null || true"

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
