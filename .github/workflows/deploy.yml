name: Deploy to Staging

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        # Full history (fetch-depth: 0) so gitleaks can resolve the push's
        # base^..head range — a shallow clone makes base^ "unknown revision"
        # and aborts the scan (blocking deploy) on multi-commit pushes.
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks (secret scanning)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: sqlite3, mbstring, xml, curl, bcmath, gd, zip, fileinfo
          tools: composer:v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install PHP dependencies (with dev)
        run: composer install

      - name: Install Node dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Create empty .env for testing
        # CI has no .env (gitignored). Booting the artisan kernel without one
        # makes Laravel's dotenv file_get_contents('.env') warn once per test
        # (~260 spurious "test triggered warning" entries). An EMPTY .env
        # satisfies that read without introducing env values, so phpunit.xml
        # fully owns the test env (APP_KEY/DB/etc.). Do NOT cp .env.example --
        # it ships an empty APP_KEY= that collides with phpunit.xml and breaks
        # CSRF (419) on every POST test.
        run: touch .env

      - name: Run tests
        run: php artisan test

      - name: Run Pint (lint check)
        run: vendor/bin/pint --test

      - name: Run PHPStan (static analysis)
        run: vendor/bin/phpstan analyze

  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: ["quality"]
    if: github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: sqlite3, mbstring, xml, curl, bcmath, gd, zip, fileinfo
          tools: composer:v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install PHP dependencies
        run: composer install --no-dev --optimize-autoloader

      - name: Install Node dependencies and build
        run: npm ci && npm run build

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.DROPLET_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Snapshot current release (for opt-in rollback)
        # spec-087: hardlink-snapshot the live code tree BEFORE rsync overwrites
        # it, so a failed step can restore the pre-deploy state when
        # DEPLOY_AUTO_ROLLBACK=true (repo var; default unset = OFF). `cp -al`
        # shares inodes — instant and ~zero extra disk (rsync's later --delete/
        # replace breaks per-file copy-on-write, leaving the live tree untouched).
        # The bare `*` glob skips dotfiles, so .env stays out for free; the live
        # DB under database/ is dropped from the snapshot (the rollback restores
        # it separately via `db:restore`). storage/ is hardlinked but excluded on
        # restore (sessions/logs persist). Bounded: keep the 5 newest snapshots.
        run: |
          ssh -i ~/.ssh/deploy_key \
            ${{ secrets.DROPLET_USER }}@${{ secrets.DROPLET_HOST }} \
            "cd ${{ secrets.DEPLOY_PATH }} && \
             mkdir -p releases && \
             SNAPDIR=releases/\$(date +%s) && \
             mkdir -p \$SNAPDIR && \
             for item in *; do \
               case \"\$item\" in releases|node_modules) continue;; esac; \
               cp -al \"\$item\" \"\$SNAPDIR/\" 2>/dev/null || true; \
             done && \
             rm -f \"\$SNAPDIR/database/database.sqlite\" 2>/dev/null || true && \
             (ls -1dt releases/*/ 2>/dev/null | tail -n +6 | xargs rm -rf) 2>/dev/null || true && \
             echo \"release snapshot: \$SNAPDIR\""

      - name: Deploy to droplet
        run: |
          rsync -avz --delete \
            --delay-updates \
            --chmod=D755,F644 \
            --exclude '.env' \
            --exclude '.git' \
            --exclude 'node_modules' \
            --exclude 'storage/framework/cache/data/*' \
            --exclude 'storage/framework/sessions/*' \
            --exclude 'storage/framework/views/*' \
            --exclude 'storage/logs/*' \
            --exclude 'database/database.sqlite' \
            --exclude 'public/hot' \
            --exclude '.phpunit.result.cache' \
            -e "ssh -i ~/.ssh/deploy_key" \
            ./ \
            ${{ secrets.DROPLET_USER }}@${{ secrets.DROPLET_HOST }}:${{ secrets.DEPLOY_PATH }}/

      - name: Inject SerpApi quality key into server .env
        # .env is rsync-excluded and server-managed, so inject the one quality
        # key we need from a GitHub secret. spec-090: the secret flows ONLY
        # through the runner env var ($SERPAPI_KEY, from `env:` below) and across
        # ssh via STDIN — it is never interpolated into the remote command text,
        # so it cannot appear in the droplet's `ps` argv (only the key NAME is in
        # the sed pattern, never the value). `printf '%s'` also writes a key
        # containing `'` or `%` verbatim — the old single-quote wrapper broke on
        # those, silently breaking live search with no deploy error. Idempotent:
        # sed removes any prior line first. Runs before config:cache below so the
        # cached config picks up the key. Skipped entirely if no secret is set.
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_API_KEY }}
        if: ${{ env.SERPAPI_KEY != '' }}
        run: |
          ssh -i ~/.ssh/deploy_key \
            ${{ secrets.DROPLET_USER }}@${{ secrets.DROPLET_HOST }} \
            "cd ${{ secrets.DEPLOY_PATH }} && sed -i '/^SERPAPI_API_KEY=/d' .env" \
            && printf 'SERPAPI_API_KEY=%s\n' "$SERPAPI_KEY" \
               | ssh -i ~/.ssh/deploy_key \
                 ${{ secrets.DROPLET_USER }}@${{ secrets.DROPLET_HOST }} \
                 "cat >> ${{ secrets.DEPLOY_PATH }}/.env" \
            && echo 'SERPAPI_API_KEY injected into .env'

      - name: Inject AI enrichment key into server .env
        # Same pattern as SerpApi key above. AI_API_KEY enables the LLM enrichment
        # pipeline (AiEnrichmentService) which fills description, phone, website_url,
        # and cuisines on non-SerpApi records. Skipped if no secret is set.
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
        if: ${{ env.AI_API_KEY != '' }}
        run: |
          ssh -i ~/.ssh/deploy_key \
            ${{ secrets.DROPLET_USER }}@${{ secrets.DROPLET_HOST }} \
            "cd ${{ secrets.DEPLOY_PATH }} && sed -i '/^AI_API_KEY=/d' .env" \
            && printf 'AI_API_KEY=%s\n' "$AI_API_KEY" \
               | ssh -i ~/.ssh/deploy_key \
                 ${{ secrets.DROPLET_USER }}@${{ secrets.DROPLET_HOST }} \
                 "cat >> ${{ secrets.DEPLOY_PATH }}/.env" \
            && echo 'AI_API_KEY injected into .env'

      - name: Inject AI fallback key into server .env
        # GitHub Models free tier (gpt-4o-mini) used when Groq is rate-limited.
        env:
          AI_FALLBACK_KEY: ${{ secrets.AI_FALLBACK_KEY }}
        if: ${{ env.AI_FALLBACK_KEY != '' }}
        run: |
          ssh -i ~/.ssh/deploy_key \
            ${{ secrets.DROPLET_USER }}@${{ secrets.DROPLET_HOST }} \
            "cd ${{ secrets.DEPLOY_PATH }} && sed -i '/^AI_FALLBACK_KEY=/d' .env" \
            && printf 'AI_FALLBACK_KEY=%s\n' "$AI_FALLBACK_KEY" \
               | ssh -i ~/.ssh/deploy_key \
                 ${{ secrets.DROPLET_USER }}@${{ secrets.DROPLET_HOST }} \
                 "cat >> ${{ secrets.DEPLOY_PATH }}/.env" \
            && echo 'AI_FALLBACK_KEY injected into .env'

      - name: Inject Google Custom Search key into server .env
        # Free tier: 100 queries/day. Searches configured review sites for images.
        env:
          GOOGLE_CSE_API_KEY: ${{ secrets.GOOGLE_CSE_API_KEY }}
          GOOGLE_CSE_CX: ${{ secrets.GOOGLE_CSE_CX }}
        if: ${{ env.GOOGLE_CSE_API_KEY != '' && env.GOOGLE_CSE_CX != '' }}
        run: |
          ssh -i ~/.ssh/deploy_key \
            ${{ secrets.DROPLET_USER }}@${{ secrets.DROPLET_HOST }} \
            "cd ${{ secrets.DEPLOY_PATH }} && sed -i '/^GOOGLE_CSE_API_KEY=/d;/^GOOGLE_CSE_CX=/d' .env" \
            && printf 'GOOGLE_CSE_API_KEY=%s\n' "$GOOGLE_CSE_API_KEY" \
               | ssh -i ~/.ssh/deploy_key \
                 ${{ secrets.DROPLET_USER }}@${{ secrets.DROPLET_HOST }} \
                 "cat >> ${{ secrets.DEPLOY_PATH }}/.env" \
            && printf 'GOOGLE_CSE_CX=%s\n' "$GOOGLE_CSE_CX" \
               | ssh -i ~/.ssh/deploy_key \
                 ${{ secrets.DROPLET_USER }}@${{ secrets.DROPLET_HOST }} \
                 "cat >> ${{ secrets.DEPLOY_PATH }}/.env" \
            && echo 'GOOGLE_CSE keys injected into .env'

      - name: Ensure Node 22 on droplet (for the Inertia SSR server)
        # The SSR process (spec-063) runs `node bootstrap/ssr/ssr.js`. The droplet
        # only ships php8.4, so ensure Node 22 matches the build runner.
        # Idempotent: a no-op once `node -v` reports v22.
        continue-on-error: true   # SSR is fail-safe (CSR fallback); never block the deploy on it
        run: |
          ssh -i ~/.ssh/deploy_key \
            ${{ secrets.DROPLET_USER }}@${{ secrets.DROPLET_HOST }} \
            "command -v node >/dev/null 2>&1 && node -v | grep -q '^v22' || \
             (curl -fsSL https://deb.nodesource.com/setup_22.x | sudo -E bash - && \
              sudo apt-get install -y nodejs) && \
             node -v"

      - name: Register the Inertia SSR supervisor program
        # Renders deploy/supervisor-ipop360-ssr.conf (rsync'd above) with the real
        # DEPLOY_PATH, writes it to /etc/supervisor/conf.d/, and reread+update so
        # supervisor picks it up (autostart brings it up on the first deploy).
        # The Post-deploy step restarts it each deploy to load the fresh ssr.js
        # bundle (supervisor only re-spawns on config change, not content change).
        continue-on-error: true   # never block the deploy on SSR setup (CSR fallback)
        run: |
          ssh -i ~/.ssh/deploy_key \
            ${{ secrets.DROPLET_USER }}@${{ secrets.DROPLET_HOST }} \
            "DEPLOY=${{ secrets.DEPLOY_PATH }} && \
             sed \"s|{{DEPLOY_PATH}}|\${DEPLOY}|g\" \${DEPLOY}/deploy/supervisor-ipop360-ssr.conf \
               | sudo tee /etc/supervisor/conf.d/ipop360-ssr.conf >/dev/null && \
             supervisorctl reread && \
             supervisorctl update"

      - name: Pre-migrate DB backup + maintenance window
        # spec-077: snapshot the SQLite DB (VACUUM INTO, rotated) so a bad
        # migration is recoverable (data loss here = a multi-month rebuild gated
        # by the SerpApi quota), then enter maintenance so no request hits a
        # half-migrated schema. Both are best-effort: if `down` can't write its
        # file (perms), we still migrate (the prior behavior); `db:backup` is the
        # safety net and never blocks. The matching `up` below unconditionally
        # removes the down file, so a failed `down` can never wedge the site.
        run: |
          ssh -i ~/.ssh/deploy_key \
            ${{ secrets.DROPLET_USER }}@${{ secrets.DROPLET_HOST }} \
            "cd ${{ secrets.DEPLOY_PATH }} && \
             (php8.4 artisan down || echo 'artisan down failed (non-fatal — migrating live)') && \
             (php8.4 artisan db:backup || echo 'db:backup failed (non-fatal)')"

      - name: Migrate + build caches (caches non-fatal)
        # spec-087: migrate is hard-fail (a schema failure must surface, not be
        # masked), but the cache builds are NON-FATAL — `view:cache` failing on a
        # removed Blade partial degrades to on-the-fly compilation (echo + true)
        # instead of aborting the chain. The safety-critical service restarts
        # moved to a SEPARATE step (`if: always()`) below, so a cache-build
        # failure (or a migrate failure) can never strand FPM on stale opcache
        # while `artisan up` serves the half-applied tree.
        # IMPORTANT: all artisan commands run as www-data (sudo -u) so cache files
        # are owned by www-data, not root. Otherwise tempnam() in BladeCompiler
        # fails with "file created in the system's temporary directory" when
        # www-data cannot overwrite root-owned compiled views at runtime.
        run: |
          ssh -i ~/.ssh/deploy_key \
            ${{ secrets.DROPLET_USER }}@${{ secrets.DROPLET_HOST }} \
            "cd ${{ secrets.DEPLOY_PATH }} && \
             sudo chown -R www-data:www-data storage database bootstrap/cache && \
             sudo -u www-data php8.4 artisan migrate --force && \
             (sudo -u www-data php8.4 artisan config:cache || echo 'config:cache failed (non-fatal)') && \
             (sudo -u www-data php8.4 artisan route:cache || echo 'route:cache failed (non-fatal)') && \
             (sudo -u www-data php8.4 artisan view:cache || echo 'view:cache failed (non-fatal)') && \
             (sudo -u www-data php8.4 artisan cache:clear || echo 'cache:clear failed (non-fatal)') && \
             (sudo -u www-data php8.4 artisan seo:sitemap || echo 'seo:sitemap failed (non-fatal)')"

      - name: Restart services (always runs)
        # spec-087 + spec-090: the safety-critical restarts run unconditionally
        # (`if: always()`) and as a SEPARATE step from the cache builds, so a
        # view:cache/config:cache failure (or a migrate failure) cannot strand
        # FPM on stale opcache. fpm: reload → restart → true (graceful). The
        # worker + SSR restarts are `|| true` (matching the existing SSR pattern)
        # so a supervisor hiccup never aborts the deploy (spec-090 facet).
        if: always()
        run: |
          ssh -i ~/.ssh/deploy_key \
            ${{ secrets.DROPLET_USER }}@${{ secrets.DROPLET_HOST }} \
            "cd ${{ secrets.DEPLOY_PATH }} && \
             (sudo systemctl reload php8.4-fpm 2>/dev/null || sudo systemctl restart php8.4-fpm 2>/dev/null || true) && \
             (supervisorctl restart ipop360-worker:* || echo 'worker restart failed (non-fatal)') && \
             (supervisorctl restart ipop360-ssr:* || echo 'ssr restart failed (non-fatal)') && \
              (supervisorctl restart ipop360-scheduler:* || echo 'scheduler restart failed (non-fatal)') && \
             (supervisorctl restart ipop360-enrich-loop:* || echo 'enrich-loop restart failed (non-fatal)')"

      - name: Register the scheduler supervisor program (secondary safeguard)
        # schedule:work runs alongside cron (schedule:run). If cron stalls,
        # supervisor keeps the long-lived worker dispatching due tasks.
        continue-on-error: true
        run: |
          ssh -i ~/.ssh/deploy_key \
            ${{ secrets.DROPLET_USER }}@${{ secrets.DROPLET_HOST }} \
            "DEPLOY=${{ secrets.DEPLOY_PATH }} && \
             sed \"s|{{DEPLOY_PATH}}|\${DEPLOY}|g\" \${DEPLOY}/deploy/supervisor-ipop360-scheduler.conf \
               | sudo tee /etc/supervisor/conf.d/ipop360-scheduler.conf >/dev/null && \
             supervisorctl reread && \
             supervisorctl update"

      - name: Register the queue worker supervisor program
        # Runs queue:work so dispatched jobs (AI enrichment, etc.) actually
        # process. Idempotent: supervisorctl reread+update only acts on changes.
        continue-on-error: true
        run: |
          ssh -i ~/.ssh/deploy_key \
            ${{ secrets.DROPLET_USER }}@${{ secrets.DROPLET_HOST }} \
            "DEPLOY=${{ secrets.DEPLOY_PATH }} && \
             sed \"s|{{DEPLOY_PATH}}|\${DEPLOY}|g\" \${DEPLOY}/deploy/supervisor-ipop360-worker.conf \
               | sudo tee /etc/supervisor/conf.d/ipop360-worker.conf >/dev/null && \
             supervisorctl reread && \
              supervisorctl update"

      - name: Register the enrich loop supervisor program
        # Runs scripts/enrich-loop.sh as a long-lived daemon for continuous
        # free-source restaurant enrichment. Idempotent.
        continue-on-error: true
        run: |
          ssh -i ~/.ssh/deploy_key \
            ${{ secrets.DROPLET_USER }}@${{ secrets.DROPLET_HOST }} \
            "DEPLOY=${{ secrets.DEPLOY_PATH }} && \
             sed \"s|{{DEPLOY_PATH}}|\${DEPLOY}|g\" \${DEPLOY}/deploy/supervisor-ipop360-enrich-loop.conf \
               | sudo tee /etc/supervisor/conf.d/ipop360-enrich-loop.conf >/dev/null && \
             supervisorctl reread && \
             supervisorctl update"

      - name: Ensure Laravel scheduler cron + logrotate (restaurants:score, apicache:gc, uptime:canary)
        continue-on-error: true
        run: |
          ssh -i ~/.ssh/deploy_key \
            ${{ secrets.DROPLET_USER }}@${{ secrets.DROPLET_HOST }} \
            "PHP_BIN=\$(command -v php8.4 || command -v php); \
             echo \"* * * * * www-data cd \${{ secrets.DEPLOY_PATH }} && \${PHP_BIN} artisan schedule:run >> \${{ secrets.DEPLOY_PATH }}/storage/logs/scheduler.log 2>&1\" \
               | sudo tee /etc/cron.d/ipop360 > /dev/null && \
             sudo chmod 644 /etc/cron.d/ipop360 && \
             echo 'CRON INSTALLED:' && sudo cat /etc/cron.d/ipop360 && \
             echo '--- LOGROTATE ---' && \
             DEPLOY_PATH_ESC=\$(echo \"\${{ secrets.DEPLOY_PATH }}\" | sed 's|/|\\/|g') && \
             cat deploy/logrotate-ipop360 | sed \"s/{{ DEPLOY_PATH }}/\$DEPLOY_PATH_ESC/g\" \
               | sudo tee /etc/logrotate.d/ipop360 > /dev/null && \
             sudo chmod 644 /etc/logrotate.d/ipop360 && \
             echo 'LOGROTATE INSTALLED:' && sudo cat /etc/logrotate.d/ipop360"

      - name: Bring site out of maintenance
        # spec-077: ALWAYS exit maintenance, even if migrate failed — a hard
        # outage (stuck 503) is worse than serving the prior code while we
        # fix-forward (and the pre-migrate snapshot enables recovery). Can't SSH
        # from a checkout, so the down file must be removed no matter who owns it.
        # Run `artisan up` as www-data (the storage owner after Post-deploy's
        # chown); if that can't unlink the file, fall back to a root `rm`.
        if: always()
        run: |
          ssh -i ~/.ssh/deploy_key \
            ${{ secrets.DROPLET_USER }}@${{ secrets.DROPLET_HOST }} \
            "cd ${{ secrets.DEPLOY_PATH }} && (sudo -u www-data php8.4 artisan up 2>/dev/null || sudo rm -f storage/framework/down || true)"

      - name: Verify deployment
        env:
          # spec-086: count-check kill-switch. Repository variable (non-secret).
          # Unset → 5. 0 → skip the count check (the 200 + data-key checks still run).
          DEPLOY_VERIFY_MIN_RESULTS: ${{ vars.DEPLOY_VERIFY_MIN_RESULTS }}
        run: |
          curl -s --connect-timeout 10 --max-time 30 -o /dev/null -w "%{http_code}" https://ipop360.com | grep -q 200 && echo 'DEPLOY OK' || exit 1
          # spec-086: assert HTTP 200 AND non-empty data on the API. A valid 200
          # with {"data":[]} is the app's load-bearing failure mode (a cache-nuking
          # migration or an over-filtering ranking change); the old check only
          # confirmed a `data` key existed, so it shipped empty deploys green.
          # Mobile/chinese used to return ~13-30 (mostly ambiguous padding); since
          # the cuisine-confidence filter drops padding when real matches exist,
          # it honestly returns ~4-8. min=3 still catches catastrophically broken
          # deploys (0 results) without being tripped by honest recall.
          # DEPLOY_VERIFY_MIN_RESULTS=0 skips the COUNT check; the 200 + data-key
          # checks always run.
          code=$(curl -s --connect-timeout 10 --max-time 30 -o /tmp/api.json -w '%{http_code}' 'https://ipop360.com/api/restaurants?cuisine=chinese&lat=30.6199783&lng=-88.1967496')
          if [ "$code" != "200" ]; then echo "API VERIFY FAILED: HTTP $code (expected 200)"; exit 1; fi
          python3 -c "
          import json, os, sys
          d = json.load(open('/tmp/api.json'))
          if 'data' not in d:
              print('API VERIFY FAILED: response has no data key'); sys.exit(1)
          raw = os.environ.get('DEPLOY_VERIFY_MIN_RESULTS') or '3'
          mn = int(raw) if raw.isdigit() else 5
          n = len(d.get('data') or [])
          if mn > 0 and n < mn:
              print(f'API VERIFY FAILED: {n} results (expected >= {mn}); set DEPLOY_VERIFY_MIN_RESULTS=0 to relax'); sys.exit(1)
          print(f'API OK: {n} results (min={mn})')
          "

      - name: Roll back to pre-deploy snapshot (opt-in)
        # spec-087: if a prior step FAILED (migrate, cache-build, restart — or the
        # Verify step) AND DEPLOY_AUTO_ROLLBACK=true (repo variable; default
        # unset = OFF), restore the pre-deploy state: rsync the newest code
        # snapshot back over the live tree (excludes .env/storage/db/releases —
        # server-managed or restored separately) + restore the latest DB snapshot
        # via `db:restore` + restart, bracketed by `artisan down`/`up`. Default
        # OFF because Verify has a false-positive surface (a SerpApi quota dip /
        # spec-073 breaker trip / network blip fails a GOOD deploy); the failed
        # GHA run is the alert, and an operator sets the repo var to enable
        # auto-rollback. The snapshot step above always runs, so a target exists.
        if: ${{ failure() && vars.DEPLOY_AUTO_ROLLBACK == 'true' }}
        run: |
          ssh -i ~/.ssh/deploy_key \
            ${{ secrets.DROPLET_USER }}@${{ secrets.DROPLET_HOST }} \
            "cd ${{ secrets.DEPLOY_PATH }} && \
             SNAP=\$(ls -1d releases/*/ 2>/dev/null | sort -r | head -1) && \
             if [ -z \"\$SNAP\" ]; then echo 'NO SNAPSHOT — cannot roll back'; exit 1; fi && \
             (php8.4 artisan down 2>/dev/null || true) && \
             echo \"rolling back to \$SNAP\" && \
             rsync -a --delete \
               --exclude '.env' \
               --exclude 'storage' \
               --exclude 'database/database.sqlite' \
               --exclude 'releases' \
               --exclude 'public/hot' \
               --exclude '.phpunit.result.cache' \
               \"\$SNAP\" ./ && \
             (php8.4 artisan db:restore --force || echo 'db:restore failed (non-fatal — code rolled back, DB left as-is)') && \
             (php8.4 artisan cache:clear 2>/dev/null || true) && \
             (sudo systemctl reload php8.4-fpm 2>/dev/null || sudo systemctl restart php8.4-fpm 2>/dev/null || true) && \
             (supervisorctl restart ipop360-worker:* || true) && \
             (supervisorctl restart ipop360-ssr:* || true) && \
             (supervisorctl restart ipop360-enrich-loop:* || echo 'enrich-loop restart failed (non-fatal)') && \
             (sudo -u www-data php8.4 artisan up 2>/dev/null || sudo rm -f storage/framework/down || true) && \
             echo 'ROLLBACK COMPLETE'"

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
