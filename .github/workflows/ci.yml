name: CI

on:
  pull_request:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: ci-quality
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: sqlite3, mbstring, xml, curl, bcmath, gd, zip, fileinfo
          tools: composer:v2
          coverage: pcov

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install PHP dependencies (with dev)
        run: composer install

      - name: Install Node dependencies
        run: npm ci

      - name: Build frontend
        # Produces public/build/manifest.json — the Inertia view tests assert
        # on rendered pages and fail with "Vite manifest not found" without it.
        run: npm run build

      - name: Create empty .env for testing
        # CI has no .env (gitignored). Without it, booting the artisan kernel
        # emits a file_get_contents('.env') warning per test (~260 spurious
        # "test triggered warning" entries). An EMPTY .env satisfies that read
        # with no env values, so phpunit.xml fully owns the test env. Do NOT
        # cp .env.example -- its empty APP_KEY= collides and breaks CSRF (419).
        run: touch .env

      - name: Run tests with coverage
        run: php artisan test --coverage-clover=coverage/phpunit.xml

      - name: Enforce coverage thresholds
        run: php scripts/check-coverage.php coverage/phpunit.xml

      - name: Run frontend tests with coverage (Vitest)
        run: npx vitest run --coverage

      - name: Run Pint (lint check)
        run: vendor/bin/pint --test

      - name: Run PHPStan (static analysis)
        run: ./vendor/bin/phpstan analyse

      - name: Upload PHPUnit coverage artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phpunit-coverage
          path: coverage/phpunit.xml

      - name: Upload Vitest coverage artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vitest-coverage
          path: coverage/
