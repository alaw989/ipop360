name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  phpunit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo_sqlite, sqlite3
          coverage: pcov

      - run: composer install --prefer-dist --no-progress --no-interaction

      - run: php artisan config:clear --ansi
      - run: php artisan test --coverage-clover=coverage/phpunit.xml

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phpunit-coverage
          path: coverage/phpunit.xml

  vitest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npx vitest run --coverage --coverage.thresholds.lines=50 --coverage.thresholds.functions=50 --coverage.thresholds.branches=50 --coverage.thresholds.statements=50

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vitest-coverage
          path: coverage/vitest
